services:
  - type: web
    name: guria-nails-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MIGRATION_USER
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: GURIA_FRONTEND_ORIGIN
        sync: false
      - key: GURIA_EVENT_CODE
        sync: false
      - key: GURIA_EVENT_ACCESS_TTL
        value: PT24H
      - key: GURIA_EVENT_AI_LIMIT
        value: 30
      - key: GURIA_EVENT_PROJECT_LIMIT
        value: 50
      - key: GURIA_AI_PROVIDER
        value: runpod
      - key: GURIA_AI_BASE_URL
        value: https://api.runpod.ai/v2
      - key: GURIA_AI_ENDPOINT_ID
        value: a5v1by47re8fd3
      - key: GURIA_AI_API_KEY
        sync: false
      - key: GURIA_AI_MODEL
        value: black-forest-labs/FLUX.2-klein-4B
      - key: GURIA_AI_MAX_WAIT_SECONDS
        value: 900

  - type: web
    name: guria-nails-web
    runtime: node
    buildCommand: node --check scripts/dev-server.mjs
    startCommand: node scripts/dev-server.mjs
    healthCheckPath: /
    envVars:
      - key: GURIA_FRONTEND_HOST
        value: 0.0.0.0
      - key: GURIA_API_BASE_URL
        sync: false
