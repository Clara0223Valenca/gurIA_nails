server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: ${SERVER_ADDRESS:127.0.0.1}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 22MB
  forward-headers-strategy: native
spring:
  application:
    name: guria-nails-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/guria_nails}
    username: ${DB_USER:guria}
    password: ${DB_PASSWORD:guria-local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 120000
      max-lifetime: 600000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRATION_USER:${DB_USER:guria}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:guria-local-only}}
  servlet:
    multipart:
      max-request-size: 22MB
      max-file-size: 20MB
  mvc:
    problemdetails:
      enabled: true
guria:
  frontend-origin: ${GURIA_FRONTEND_ORIGIN:http://127.0.0.1:4173}
  event:
    code: ${GURIA_EVENT_CODE:}
    access-token-ttl: ${GURIA_EVENT_ACCESS_TTL:PT24H}
    ai-generation-limit: ${GURIA_EVENT_AI_LIMIT:10}
    project-limit: ${GURIA_EVENT_PROJECT_LIMIT:20}
  ai:
    provider: ${GURIA_AI_PROVIDER:pollinations}
    base-url: ${GURIA_AI_BASE_URL:https://gen.pollinations.ai}
    api-key: ${GURIA_AI_API_KEY:}
    endpoint-id: ${GURIA_AI_ENDPOINT_ID:}
    model: ${GURIA_AI_MODEL:black-forest-labs/flux.2-klein-4b}
    generate-path: ${GURIA_AI_GENERATE_PATH:/generate}
    improve-path: ${GURIA_AI_IMPROVE_PATH:/improve}
    poll-interval-ms: ${GURIA_AI_POLL_INTERVAL_MS:2000}
    max-wait-seconds: ${GURIA_AI_MAX_WAIT_SECONDS:900}
